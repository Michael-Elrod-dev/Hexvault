[package]
name = "hexvault"
version = "1.0.0"
description = "Hexvault"
license = "MIT"
authors = ["Michael Elrod"]
edition = "2021"

[lib]
name = "hexvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls avoids the OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
urlencoding = "2"
base64 = "0.22"
arboard = "3"
tokio = { version = "1", features = ["time"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
